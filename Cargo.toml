[package]
name = "soundboard"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = "0.29"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aac", "flac", "mp3", "ogg", "wav"] }
tray-icon = "0.21"

[build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
